{{ define "main" }}
<h1>{{ .Title }}</h1>
<section class="post-list">
  {{ range .Pages }}
  <article class="post-item">
    <time>{{ .Date.Format "2006-01-02" }}</time>
    <a href="{{ .Permalink }}">{{ .Title }}</a>
  </article>
  {{ else }}
  <p>No posts yet.</p>
  {{ end }}
</section>
{{ end }}
